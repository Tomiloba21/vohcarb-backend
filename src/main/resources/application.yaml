spring:
  application:
    name: vohcarb-backend
  threads:
    virtual:
      enabled: true
  # Default: embedded H2 in MariaDB mode, stored under ./data. No install needed.
  # Run with SPRING_PROFILES_ACTIVE=mariadb to use a real MariaDB/MySQL server.
  datasource:
    url: jdbc:h2:file:./data/vohcarb;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Loads senses/examples for a whole page of words in a few queries instead of one per word.
      hibernate.default_batch_fetch_size: 100
      # Instants are stored as UTC in plain DATETIME columns (same on H2 and MariaDB).
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

vohcarb:
  auth:
    jwt-secret: ${JWT_SECRET:}

---
# Local development (the default for ./gradlew bootRun): dev login on, throwaway signing key.
spring:
  config:
    activate:
      on-profile: dev
vohcarb:
  auth:
    jwt-secret: dev-only-secret-never-use-in-production-000000
    dev-login-enabled: true

---
spring:
  config:
    activate:
      on-profile: mariadb
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/vohcarb}
    username: ${DB_USER:vohcarb}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false

---
# One-off catalog import: no web server, runs ImportRunner and exits.
spring:
  config:
    activate:
      on-profile: import
  main:
    web-application-type: none

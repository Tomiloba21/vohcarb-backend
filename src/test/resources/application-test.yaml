spring:
  datasource:
    url: jdbc:h2:mem:vohcarb-test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
vohcarb:
  auth:
    jwt-secret: test-only-secret-never-use-in-production-0000
    dev-login-enabled: true
  reminders:
    enabled: false
  # Live matches in tests: short timings so whole matches run in seconds
  live:
    countdown-millis: 50
    round-millis: 1500
    word-millis: 1500
    vote-millis: 1500
    results-millis: 100
    quick-wait-millis: 200
    grace-millis: 100
